version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # @types/vscode matches engines.vscode in apps/textscene-vscode, and vsce refuses a
    # newer one. The engine floor moves by hand, and the types move with it.
    ignore:
      - dependency-name: '@types/vscode'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # The publish tools of the release jobs, outside the pnpm workspace.
  - package-ecosystem: 'npm'
    directory: '/.github/release-tools'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
