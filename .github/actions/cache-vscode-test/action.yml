name: Cache the VS Code test build
description: Resolve the editor version and cache the downloaded build for this runner.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(node scripts/ci/vscodeTestCacheVersion.mjs)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "TEXTSCENE_VSCODE_VERSION=$version" >> "$GITHUB_ENV"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/textscene-vscode/.vscode-test
        key: vscode-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
