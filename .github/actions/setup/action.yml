name: Set up the workspace
description: Install pnpm (the version in packageManager), Node and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
