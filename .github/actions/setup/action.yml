name: Set up the workspace
description: Install pnpm (the version in packageManager), Node and the workspace dependencies.

inputs:
  template-files:
    description: >-
      Where the install gets Godot's template files: `source` in the CI image, which holds Godot's
      source, or `artifact` from the godot-template-files artifact of this run's godot-templates job.
    default: source

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # The install's postinstall vendors the demo corpora and writes the fixture manifest. It
    # fetches nothing when the restored corpora hold the current recipe. The script prints that
    # recipe's key.
    - id: demos
      run: echo "key=$(node scripts/vendor-godot-demos.mjs --key)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          scenes/demos
          scenes/isometric
          !scenes/isometric/previews
        key: godot-demos-${{ steps.demos.outputs.key }}

    # The repository holds no copy of Godot's template files (scripts/godot-templates/templateFiles.mjs).
    - if: inputs.template-files == 'artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: godot-template-files
        path: packages/textscene-core/src/shaders/template

    - run: pnpm install --frozen-lockfile
      shell: bash
