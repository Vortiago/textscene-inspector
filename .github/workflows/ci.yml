name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  # GitHub Pages (disabled for private repo)
  # pages: write
  # id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Run Tests
        run: pnpm test:unit

      - name: Build Web Previewer
        run: pnpm --filter @textscene/web-previewer build

      - name: Build Linter CLI
        run: pnpm --filter @textscene/linter build

      - name: Package VS Code Extension
        run: pnpm vsc:package

      # Needs the webview + extension host bundles from the packaging step
      # above: the webview budget is informational (warn-only) until the
      # remaining gap is closed (see ARCHITECTURE.md, "Bundle Size Target"),
      # but the host-bundle react/three guard inside this script always
      # hard-fails regardless of that flag.
      - name: Check bundle size
        run: pnpm check:bundle-size

      # Needs @textscene/core built, which the Build Web Previewer step
      # above already triggered via its prebuild hook.
      - name: Check package (publint)
        run: pnpm check:package

      - uses: actions/upload-artifact@v7
        with:
          name: web-previewer
          path: apps/textscene-web/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: apps/textscene-vscode/*.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: tscn-linter-cli
          path: apps/textscene-linter/dist/cli.js

  visual-regression:
    name: Visual Regression (goldens + 2D overlay)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Reuse the dist built by the build job. run.mjs rebuilds by default —
      # locally that guards against capturing a stale dist that predates the
      # change under test — but here the artifact IS this commit's build, so
      # VISUAL_SKIP_BUILD=1 below keeps it and skips a redundant cold rebuild
      # (which would also wipe this download via vite's emptyOutDir).
      - uses: actions/download-artifact@v4
        with:
          name: web-previewer
          path: apps/textscene-web/dist/

      - name: Cache Playwright chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Compare golden images
        run: pnpm test:visual
        env:
          VISUAL_SKIP_BUILD: '1'

      # The goldens are WebGL-canvas-only and happy-dom has no layout, so the
      # 2D DOM overlay has no other gate (ADR-0024). Reuses the same downloaded
      # dist via `vite preview`; bundled chromium, never system Chrome.
      - name: Verify 2D Control overlay
        run: |
          pnpm --filter @textscene/web-previewer preview --port 4173 --strictPort &
          for _ in $(seq 60); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          pnpm verify:2d

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: scripts/visual/output/

      - name: Upload 2D overlay captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-2d
          path: scripts/showcase/output/
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # "textscene-inspector" is the VS Code extension package (apps/textscene-vscode);
      # the workspace root is named @textscene/monorepo, so this filter is unambiguous.
      - name: Run Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter textscene-inspector test:integration

      - name: Run Integration Tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter textscene-inspector test:integration

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-${{ matrix.os }}
          path: |
            apps/textscene-vscode/.test-workspace/
            apps/textscene-vscode/out/

  vsix-verification:
    name: VSIX Package Verification (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: .

      - name: Verify VSIX package structure
        shell: bash
        run: |
          # Check VSIX file exists
          if [ ! -f *.vsix ]; then
            echo "Error: VSIX file not found"
            exit 1
          fi

          VSIX_FILE=$(ls *.vsix)
          echo "Verifying VSIX package: $VSIX_FILE"

          # VSIX is a zip file - verify it's valid and contains expected files
          unzip -l "$VSIX_FILE" | grep "extension/dist/extension.js" || { echo "Error: extension.js not found in VSIX"; exit 1; }
          unzip -l "$VSIX_FILE" | grep "extension/dist/extension.web.js" || { echo "Error: extension.web.js (vscode.dev web-extension host) not found in VSIX"; exit 1; }
          unzip -l "$VSIX_FILE" | grep "extension/package.json" || { echo "Error: package.json not found in VSIX"; exit 1; }
          unzip -l "$VSIX_FILE" | grep "extension.vsixmanifest" || { echo "Error: extension.vsixmanifest not found in VSIX"; exit 1; }

          # The manifest must declare the browser (web extension) entry point
          unzip -p "$VSIX_FILE" extension/package.json | grep '"browser"' || { echo "Error: browser entry missing from packaged package.json"; exit 1; }

          echo "✓ VSIX package structure is valid"

      # GitHub Pages deployment (disabled for private repo)
      # - if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: apps/textscene-web/dist/

