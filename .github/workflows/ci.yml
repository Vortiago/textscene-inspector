name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  # GitHub Pages (disabled for private repo)
  # pages: write
  # id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Run Tests
        run: pnpm test:unit

      - name: Build Web Previewer
        run: pnpm --filter @textscene/web-previewer build

      - name: Build Linter CLI
        run: pnpm --filter @textscene/linter build

      - name: Package VS Code Extension
        run: pnpm vsc:package

      - uses: actions/upload-artifact@v4
        with:
          name: web-previewer
          path: apps/textscene-web/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: apps/textscene-vscode/*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: tscn-linter-cli
          path: apps/textscene-linter/dist/cli.js

      # GitHub Pages deployment (disabled for private repo)
      # - if: github.ref == 'refs/heads/main'
