name: GitHub Pages

# Deploys the public edition of the web previewer: no built-in scenes, no parity
# gallery and no source maps. Cloudflare Pages builds the dev edition apart from this,
# with `pnpm build:deploy`. Only a main commit that CI passed deploys here.
on:
  workflow_run:
    # A workflow_run trigger matches by name: renaming ci.yml's workflow stops the deploy.
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway: a newer commit waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      is-passed-commit: ${{ steps.passed.outputs.is-passed-commit }}
    steps:
      # The default ref, not workflow_run.head_sha: a job on main shares main's cache,
      # so it runs only main's own code (CodeQL actions/cache-poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Main may hold a newer commit than the one CI passed. That commit deploys when
      # its own CI run passes, so this run skips the build.
      - name: Check that main still holds the commit CI passed
        id: passed
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PASSED_SHA" ] || [ "$PASSED_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "is-passed-commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has moved past $PASSED_SHA. Its newer commit deploys after CI."
            echo "is-passed-commit=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.passed.outputs.is-passed-commit == 'true'
        uses: ./.github/actions/setup

      - name: Build and check the public site
        if: steps.passed.outputs.is-passed-commit == 'true'
        run: pnpm build:pages

      - if: steps.passed.outputs.is-passed-commit == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: steps.passed.outputs.is-passed-commit == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/textscene-web/dist/

  deploy:
    needs: build
    if: needs.build.outputs.is-passed-commit == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
