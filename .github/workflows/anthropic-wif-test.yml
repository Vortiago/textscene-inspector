name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01LerZV3SooMij3Zw59Neude",
            "organization_id": "1ab71a0e-ff1e-4f63-9999-b3f0d685d4f1",
            "service_account_id": "svac_017DSiKWH7yYdmMhKTpNb5Nv",
            "workspace_id": "wrkspc_01JmuR8g6h7JStm7hFpxStdt"
          }
          JSON
