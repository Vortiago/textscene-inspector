name: Claude review

# Claude reviews a pull request against REVIEW.md and posts only findings that clear its bar.
# It authenticates with a Claude subscription token from `claude setup-token`, not an API key,
# so a review spends subscription usage and no API credit.
#
# A review spends the repository owner's usage, so only the owner starts one:
# - The owner's own pull request gets one review when it is ready, not one per push.
# - The owner comments `/claude-review` on any pull request, a fork's included, to ask for a
#   review or for another one.
#
# Each action is pinned to a commit, because a tag can move and the action holds the token.
# Dependabot updates the pin and its version comment together.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    name: Review
    # A fork's pull_request run gets no secrets, and a comment run reads this file from the
    # default branch, so a pull request cannot start a review by editing this condition.
    if: >-
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/claude-review'))
    # A second request for the same pull request cancels the review still in progress. The
    # group sits on the job, so a skipped run, such as another comment, cancels nothing.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # The action exchanges the OIDC token for a Claude GitHub App token.
      id-token: write
    steps:
      # No `ref`: a pull_request run checks out the pull request merged into its base, and a
      # comment run checks out the default branch. A fork's code never reaches the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # bubblewrap gives the scrub below a PID namespace, so a command cannot read the token
      # from Claude's own process through /proc. The scrub still works without it.
      - name: Install subprocess isolation
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat

      # Inline comments carry `confirmed: true` because the classifier that filters buffered
      # comments needs an API key, which this workflow does not have.
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        env:
          # The diff of a fork's pull request can carry a prompt injection. The scrub strips the
          # token from every command Claude runs, while Claude itself keeps it.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            The working directory holds ${{ github.event_name == 'pull_request' && 'the pull request merged into its base branch' || 'the default branch, not the pull request. The new code exists only in `gh pr diff`' }}.

            1. Read REVIEW.md. It is the bar for this review, and it overrides any default
               review habit you have.
            2. Read AGENTS.md for the project conventions that REVIEW.md refers to.
            3. Read the diff with `gh pr diff`. Read the description and the earlier comments
               with `gh pr view --comments`.
            4. For each finding that clears the bar in REVIEW.md, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`.
            5. Post one summary comment with `gh pr comment`, in the shape REVIEW.md gives.

            Post only GitHub comments. Do not submit review text as a message.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
