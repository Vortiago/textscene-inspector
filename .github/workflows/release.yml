name: Release

# A tag releases one package: `vscode-v1.2.3` the extension, `linter-v1.2.3` the linter and
# `lsp-v1.2.3` the language server. The tag is the version: the release jobs write it into
# the package's manifest.
on:
  push:
    tags: ['vscode-v*', 'linter-v*', 'lsp-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package: ${{ steps.tag.outputs.package }}
      directory: ${{ steps.tag.outputs.directory }}
      version: ${{ steps.tag.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release notes compare against the previous tag of the same package, and start with
      # the message of an annotated tag. The forced fetch brings each tag object as pushed.
      - name: Fetch the tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/*:refs/tags/*'

      # A tag on a commit that never reached main would publish unreviewed code.
      - name: Check that main holds the tagged commit
        run: |
          git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME tags $GITHUB_SHA, which main does not contain"; exit 1; }

      # First, so a malformed or lower tag fails before the long gate.
      - name: Read the package and version from the tag
        id: tag
        run: node scripts/ci/releaseVersion.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # A random delimiter, so no line of a tag message can end the multi-line output early.
      - name: Write the release notes
        id: notes
        run: |
          delimiter="notes_$(openssl rand -hex 16)"
          notes=$(node scripts/ci/releaseNotes.mjs "$GITHUB_REF_NAME" "$PREVIOUS_TAG")
          printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$notes" "$delimiter" >> "$GITHUB_OUTPUT"
        env:
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}

      - uses: ./.github/actions/setup

      - run: pnpm validate

  release-vscode:
    name: Release the extension on GitHub
    needs: validate
    if: needs.validate.outputs.package == 'vscode'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        run: npm pkg set version="$VERSION" --prefix "$DIRECTORY"
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIRECTORY: ${{ needs.validate.outputs.directory }}

      - name: Package VS Code Extension
        run: pnpm vsc:package

      # The public edition, as on GitHub Pages: no built-in scenes and no parity gallery.
      - name: Build and check the web previewer
        run: pnpm build:pages

      - name: Archive Web Previewer Dist
        run: tar -czf web-dist.tar.gz -C apps/textscene-web dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: apps/textscene-vscode/*.vsix
          if-no-files-found: error

      # The extension's release is the repository's "Latest": it ships most often.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ needs.validate.outputs.notes }}
          make_latest: true
          files: |
            apps/textscene-vscode/*.vsix
            web-dist.tar.gz

  # The linter and the language server ship the same way: a tarball on GitHub and on npm.
  release-npm-package:
    name: Release ${{ needs.validate.outputs.package }} on GitHub
    needs: validate
    if: needs.validate.outputs.package == 'linter' || needs.validate.outputs.package == 'lsp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      DIRECTORY: ${{ needs.validate.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        run: npm pkg set version="$VERSION" --prefix "$DIRECTORY"

      - name: Build the package
        run: pnpm --filter "./$DIRECTORY" build

      # pnpm pack, not npm: it rewrites the catalog: and workspace: specifiers.
      - name: Pack the tarball
        run: cd "$DIRECTORY" && pnpm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ needs.validate.outputs.directory }}/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ needs.validate.outputs.notes }}
          make_latest: false
          files: ${{ needs.validate.outputs.directory }}/*.tgz

  # One job per registry, so a re-run retries only the failed one. No workspace install
  # here: an install script would run beside the OIDC token.

  npm:
    name: Publish ${{ needs.validate.outputs.package }} to npm
    needs: [validate, release-npm-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    env:
      PACKAGE: ${{ needs.validate.outputs.package }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later, newer than some Node 24 releases bundle.
      - run: npm install --global npm@11.21.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      # npm authenticates through the package's trusted publisher (OIDC) and attaches provenance.
      # `npm view` prints nothing, and exits 0, for a version the registry does not hold.
      - name: Publish @textscene/${{ needs.validate.outputs.package }}
        run: |
          if [ -n "$(npm view "@textscene/$PACKAGE@$VERSION" version 2>/dev/null)" ]; then
            echo "@textscene/$PACKAGE@$VERSION is already on npm: skipping"
            exit 0
          fi
          npm publish "textscene-$PACKAGE-$VERSION.tgz"

  vscode-marketplace:
    name: Publish the extension to the VS Code Marketplace
    needs: [validate, release-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension

      # Entra ID, not a PAT: Azure DevOps retires the global PATs the Marketplace needs on 2026-12-01.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The `vortiago` publisher needs this ID as a Contributor member before a publish passes.
      - name: Show the Marketplace member ID
        run: |
          MEMBER_ID=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          if [ -z "$MEMBER_ID" ]; then
            echo "::error::Azure DevOps returned no profile ID for the identity"
            exit 1
          fi
          echo "::notice title=Marketplace member ID::$MEMBER_ID"

      # Before the publish, which skips a version the Marketplace already has without this check.
      - name: Check the publish rights for vortiago
        run: >-
          npx --yes @vscode/vsce@4.0.0 verify-pat vortiago --azure-credential
          || { echo "::error::Add the Marketplace member ID to the vortiago publisher as a Contributor"; exit 1; }

      # Pinned to the version in the lockfile, since this job installs no workspace.
      - name: Publish textscene-inspector
        run: >-
          npx --yes @vscode/vsce@4.0.0 publish --azure-credential --skip-duplicate
          --packagePath "textscene-inspector-$VERSION.vsix"

  open-vsx:
    name: Publish the extension to Open VSX
    needs: [validate, release-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Skipped without the secret. A secret cannot appear in `if:`, so a step output carries it.
      - name: Detect the Open VSX token
        id: token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OVSX_PAT not configured: skipping Open VSX publish"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.token.outputs.present == 'true'
        with:
          name: vscode-extension

      - name: Publish textscene-inspector
        if: steps.token.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: >-
          npx --yes ovsx@1.2.0 publish "textscene-inspector-$VERSION.vsix"
          --skip-duplicate
