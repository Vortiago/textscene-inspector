name: Release

# A tag releases one package: `vscode-v1.2.3` the extension, `linter-v1.2.3` the linter.
# The tag is the version: the release jobs write it into the package's manifest.
on:
  push:
    tags: ['vscode-v*', 'linter-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package: ${{ steps.tag.outputs.package }}
      directory: ${{ steps.tag.outputs.directory }}
      version: ${{ steps.tag.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7

      # The release notes compare against the previous tag of the same package.
      - name: Fetch the tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/*:refs/tags/*'

      # First, so a malformed or lower tag fails before the long gate.
      - name: Read the package and version from the tag
        id: tag
        run: node scripts/ci/releaseVersion.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - run: pnpm validate

  release-vscode:
    name: Release the extension on GitHub
    needs: validate
    if: needs.validate.outputs.package == 'vscode'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        run: npm pkg set version="$VERSION" --prefix "$DIRECTORY"
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIRECTORY: ${{ needs.validate.outputs.directory }}

      - name: Package VS Code Extension
        run: pnpm vsc:package

      # The public edition, as on GitHub Pages: no built-in scenes and no parity gallery.
      - name: Build and check the web previewer
        run: pnpm build:pages

      - name: Archive Web Previewer Dist
        run: tar -czf web-dist.tar.gz -C apps/textscene-web dist

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: apps/textscene-vscode/*.vsix
          if-no-files-found: error

      # The extension's release is the repository's "Latest": it ships most often.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Without an earlier tag, generated notes would list every merged pull request.
          generate_release_notes: ${{ needs.validate.outputs.previous_tag != '' }}
          body: ${{ needs.validate.outputs.previous_tag == '' && 'First public release.' || '' }}
          previous_tag: ${{ needs.validate.outputs.previous_tag }}
          make_latest: true
          files: |
            apps/textscene-vscode/*.vsix
            web-dist.tar.gz

  release-linter:
    name: Release the linter on GitHub
    needs: validate
    if: needs.validate.outputs.package == 'linter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        run: npm pkg set version="$VERSION" --prefix "$DIRECTORY"
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIRECTORY: ${{ needs.validate.outputs.directory }}

      - name: Build Linter CLI
        run: pnpm --filter @textscene/linter build

      # pnpm pack, not npm: it rewrites the catalog: and workspace: specifiers.
      - name: Pack Linter Tarball
        run: cd apps/textscene-linter && pnpm pack

      - uses: actions/upload-artifact@v7
        with:
          name: linter-tarball
          path: apps/textscene-linter/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Without an earlier tag, generated notes would list every merged pull request.
          generate_release_notes: ${{ needs.validate.outputs.previous_tag != '' }}
          body: ${{ needs.validate.outputs.previous_tag == '' && 'First public release.' || '' }}
          previous_tag: ${{ needs.validate.outputs.previous_tag }}
          make_latest: false
          files: apps/textscene-linter/*.tgz

  # One job per registry, so a re-run retries only the failed one. No workspace install
  # here: an install script would run beside the OIDC token.

  npm:
    name: Publish the linter to npm
    needs: [validate, release-linter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later, newer than some Node 24 releases bundle.
      - run: npm install --global npm@11

      - uses: actions/download-artifact@v8
        with:
          name: linter-tarball

      # npm authenticates through the trusted publisher (OIDC) and attaches provenance.
      # `npm view` prints nothing, and exits 0, for a version the registry does not hold.
      - name: Publish @textscene/linter
        run: |
          if [ -n "$(npm view "@textscene/linter@$VERSION" version 2>/dev/null)" ]; then
            echo "@textscene/linter@$VERSION is already on npm: skipping"
            exit 0
          fi
          npm publish "textscene-linter-$VERSION.tgz"

  vscode-marketplace:
    name: Publish the extension to the VS Code Marketplace
    needs: [validate, release-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension

      # Entra ID, not a PAT: Azure DevOps retires the global PATs the Marketplace needs on 2026-12-01.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned to the version in the lockfile, since this job installs no workspace.
      - name: Publish textscene-inspector
        run: >-
          npx --yes @vscode/vsce@4.0.0 publish --azure-credential --skip-duplicate
          --packagePath "textscene-inspector-$VERSION.vsix"

  open-vsx:
    name: Publish the extension to Open VSX
    needs: [validate, release-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Skipped without the secret. A secret cannot appear in `if:`, so a step output carries it.
      - name: Detect the Open VSX token
        id: token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OVSX_PAT not configured: skipping Open VSX publish"
          fi

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: vscode-extension

      - name: Publish textscene-inspector
        if: steps.token.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: >-
          npx --yes ovsx@1.2.0 publish "textscene-inspector-$VERSION.vsix"
          --skip-duplicate -p "$OVSX_PAT"
