name: anthropic-wif-model-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Test an Opus request through federation
        run: |
          curl --fail-with-body -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON > /tmp/anthropic-token-response.json
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01LerZV3SooMij3Zw59Neude",
            "organization_id": "1ab71a0e-ff1e-4f63-9999-b3f0d685d4f1",
            "service_account_id": "svac_017DSiKWH7yYdmMhKTpNb5Nv",
            "workspace_id": "wrkspc_01JmuR8g6h7JStm7hFpxStdt"
          }
          JSON

          TOKEN="$(jq -r '.access_token' /tmp/anthropic-token-response.json)"
          test "$TOKEN" != null
          STATUS="$(curl -sS -o /tmp/anthropic-model-response.json -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $TOKEN" \
            -H "anthropic-version: 2026-10-21" \
            -H "content-type: application/json" \
            --data '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"Reply with OK."}]}')"
          echo "Opus request returned HTTP $STATUS"
          jq 'if .error then {type, error} else {type, model, content, usage} end' /tmp/anthropic-model-response.json
          test "$STATUS" -ge 200 && test "$STATUS" -lt 300
