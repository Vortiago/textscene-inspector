<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextScene Inspector - Web</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1e1e1e;
        color: #fff;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 1rem;
        background: #252526;
        border-bottom: 1px solid #3e3e42;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }

      main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      #controls {
        width: 300px;
        padding: 1rem;
        background: #252526;
        border-right: 1px solid #3e3e42;
        overflow-y: auto;
      }

      #tree-viewer-panel {
        width: 350px;
        background: #1e1e1e;
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
      }

      #tree-viewer-header {
        padding: 0.75rem 1rem;
        background: #252526;
        border-bottom: 1px solid #3e3e42;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      #tree-viewer-header h2 {
        font-size: 0.875rem;
        font-weight: 600;
        flex: 1;
        margin: 0;
      }

      .tree-control-btn {
        width: auto;
        padding: 0.25rem 0.5rem;
        margin: 0;
        background: #3e3e42;
        font-size: 0.75rem;
      }

      .tree-control-btn:hover {
        background: #555;
      }

      #tree-search {
        margin: 0.75rem;
        padding: 0.5rem;
        background: #3e3e42;
        border: 1px solid #555;
        color: #fff;
        border-radius: 4px;
        font-size: 0.875rem;
      }

      #tree-viewer-container {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
      }

      #canvas-container {
        flex: 1;
        position: relative;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .file-input {
        margin-bottom: 1rem;
      }

      input[type="file"] {
        display: block;
        width: 100%;
        padding: 0.5rem;
        background: #3e3e42;
        border: 1px solid #555;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
      }

      .info {
        margin-top: 1rem;
        padding: 1rem;
        background: #3e3e42;
        border-radius: 4px;
        font-size: 0.875rem;
      }

      button {
        width: 100%;
        padding: 0.5rem;
        margin-top: 1rem;
        background: #0e639c;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
      }

      button:hover {
        background: #1177bb;
      }

      button:disabled {
        background: #555;
        cursor: not-allowed;
      }

      .error {
        margin-top: 1rem;
        padding: 1rem;
        background: #5a1d1d;
        border: 1px solid #be1100;
        border-radius: 4px;
        font-size: 0.875rem;
        display: none;
      }

      .error.visible {
        display: block;
      }

      .scene-info {
        margin-top: 1rem;
        padding: 1rem;
        background: #1e3a1e;
        border: 1px solid #2d5c2d;
        border-radius: 4px;
        font-size: 0.875rem;
        display: none;
      }

      .scene-info.visible {
        display: block;
      }

      .scene-info h3 {
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }

      .scene-info p {
        margin: 0.25rem 0;
        color: #ccc;
      }

      /* Scene Tree Viewer Styles */
      .tree-root {
        font-size: 0.8125rem;
        user-select: none;
      }

      .tree-empty {
        padding: 1rem;
        text-align: center;
        color: #888;
      }

      .tree-node {
        margin: 0;
      }

      .tree-node-header {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
        border-radius: 3px;
        transition: background-color 0.15s;
      }

      .tree-node-header:hover {
        background: #2a2d2e;
      }

      .tree-node-header.selected {
        background: #094771;
      }

      .tree-node-header.selected:hover {
        background: #0d5a8c;
      }

      .tree-expand-icon {
        width: 12px;
        font-size: 0.625rem;
        color: #ccc;
        cursor: pointer;
        flex-shrink: 0;
      }

      .tree-expand-spacer {
        width: 12px;
        text-align: center;
        font-size: 0.5rem;
        color: #555;
        flex-shrink: 0;
      }

      .tree-node-type {
        display: inline-block;
        padding: 0.125rem 0.375rem;
        border-radius: 3px;
        font-size: 0.625rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        flex-shrink: 0;
      }

      .type-node3d {
        background: #3e3e42;
        color: #ccc;
      }

      .type-mesh {
        background: #1e4d2b;
        color: #95e3b3;
      }

      .type-camera {
        background: #3d2e00;
        color: #ffcc00;
      }

      .type-light {
        background: #4d3319;
        color: #ffcc99;
      }

      .type-unknown {
        background: #2a1a2e;
        color: #c792ea;
      }

      .tree-node-name {
        flex: 1;
        color: #ddd;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tree-transform-icon {
        color: #6c9;
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .tree-visibility-icon {
        font-size: 0.875rem;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0 0.125rem;
        opacity: 0.6;
        transition: opacity 0.15s;
      }

      .tree-visibility-icon:hover {
        opacity: 1;
      }

      .tree-node-header.hidden {
        opacity: 0.5;
      }

      .tree-node-header.hidden .tree-node-name {
        color: #777;
        text-decoration: line-through;
      }

      .tree-node-header.hidden .tree-node-type {
        opacity: 0.6;
      }

      .tree-node-children {
        margin-left: 0;
      }

      /* Node Details Panel Styles */
      #node-details-panel {
        border-top: 1px solid #3e3e42;
        padding: 1rem;
        background: #252526;
        font-size: 0.8125rem;
        display: none;
      }

      #node-details-panel.visible {
        display: block;
      }

      #node-details-panel h3 {
        font-size: 0.875rem;
        margin: 0 0 0.75rem 0;
        color: #ddd;
      }

      .detail-row {
        display: flex;
        margin-bottom: 0.5rem;
      }

      .detail-label {
        color: #888;
        min-width: 70px;
        flex-shrink: 0;
      }

      .detail-value {
        color: #ddd;
        font-family: 'Consolas', 'Monaco', monospace;
        flex: 1;
        word-break: break-all;
      }

      .transform-section {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid #3e3e42;
      }

      .transform-section h4 {
        font-size: 0.75rem;
        margin: 0 0 0.5rem 0;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .transform-grid {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 0.375rem;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.75rem;
      }

      .transform-axis {
        color: #888;
        font-weight: bold;
      }

      .transform-value {
        color: #6c9;
      }

      .copy-btn {
        width: auto;
        padding: 0.375rem 0.75rem;
        margin-top: 0.75rem;
        background: #3e3e42;
        font-size: 0.75rem;
      }

      .copy-btn:hover {
        background: #555;
      }

      /* Test Fixtures Selector Styles */
      .fixtures-section {
        margin-top: 1rem;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        overflow: hidden;
      }

      .fixtures-header {
        padding: 0.5rem 0.75rem;
        background: #3e3e42;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
      }

      .fixtures-header:hover {
        background: #4a4a4e;
      }

      .fixtures-header h3 {
        font-size: 0.875rem;
        font-weight: 600;
        margin: 0;
      }

      .fixtures-toggle {
        font-size: 0.75rem;
        color: #888;
        transition: transform 0.2s;
      }

      .fixtures-toggle.expanded {
        transform: rotate(180deg);
      }

      .fixtures-list {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
        background: #2a2a2e;
      }

      .fixtures-list.expanded {
        max-height: 400px;
        overflow-y: auto;
      }

      .fixture-category {
        padding: 0.5rem 0.75rem 0.25rem;
        font-size: 0.7rem;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-top: 1px solid #3e3e42;
      }

      .fixture-category:first-child {
        border-top: none;
      }

      .fixture-item {
        padding: 0.375rem 0.75rem 0.375rem 1.5rem;
        font-size: 0.8125rem;
        color: #ddd;
        cursor: pointer;
        transition: background 0.15s;
      }

      .fixture-item:hover {
        background: #3e3e42;
        color: #fff;
      }

      .fixture-item:active {
        background: #094771;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>TextScene Inspector</h1>
      </header>
      <main>
        <div id="controls">
          <div class="file-input">
            <label for="file-upload">Upload TSCN File:</label>
            <input type="file" id="file-upload" accept=".tscn" />
          </div>

          <div class="fixtures-section">
            <div class="fixtures-header" id="fixtures-header">
              <h3>Test Fixtures</h3>
              <span class="fixtures-toggle">▼</span>
            </div>
            <div class="fixtures-list" id="fixtures-list"></div>
          </div>

          <button id="reset-camera" disabled>Reset Camera</button>

          <div class="error" id="error-display">
            <strong>Error:</strong>
            <p id="error-message"></p>
          </div>

          <div class="scene-info" id="scene-info">
            <h3>Scene Info</h3>
            <p id="node-count">Nodes: 0</p>
            <p id="root-node">Root: None</p>
          </div>

          <div class="info">
            <p>Select a .tscn file to preview it in 3D.</p>
            <p style="margin-top: 0.5rem; color: #888;">
              Use mouse to orbit camera. Scroll to zoom.
            </p>
          </div>
        </div>
        <div id="tree-viewer-panel">
          <div id="tree-viewer-header">
            <h2>Scene Tree</h2>
            <button class="tree-control-btn" id="expand-all-btn" title="Expand All">⊞</button>
            <button class="tree-control-btn" id="collapse-all-btn" title="Collapse All">⊟</button>
          </div>
          <input type="text" id="tree-search" placeholder="Search nodes..." />
          <div id="tree-viewer-container"></div>
          <div id="node-details-panel">
            <h3 id="details-node-name">No node selected</h3>
            <div id="details-content"></div>
          </div>
        </div>
        <div id="canvas-container">
          <canvas id="canvas"></canvas>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
