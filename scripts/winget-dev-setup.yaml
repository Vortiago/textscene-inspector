# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# WinGet Configuration for TextScene Inspector development environment
# Installs required tools: Node.js LTS and pnpm
# Usage: winget configure scripts/winget-dev-setup.yaml

properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Node.js LTS
      settings:
        id: OpenJS.NodeJS.LTS
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install pnpm package manager
      settings:
        id: pnpm.pnpm
        source: winget
