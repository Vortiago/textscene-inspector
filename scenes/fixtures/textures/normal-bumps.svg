<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Simple checkerboard pattern with varying normals -->
  <defs>
    <pattern id="normalPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <!-- Tile 1: Normal pointing up-right -->
      <rect x="0" y="0" width="16" height="16" fill="#9090ff"/>
      <!-- Tile 2: Normal pointing up-left -->
      <rect x="16" y="0" width="16" height="16" fill="#7090ff"/>
      <!-- Tile 3: Normal pointing straight -->
      <rect x="0" y="16" width="16" height="16" fill="#8080ff"/>
      <!-- Tile 4: Normal with slight variation -->
      <rect x="16" y="16" width="16" height="16" fill="#8088ff"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#normalPattern)"/>
</svg>
