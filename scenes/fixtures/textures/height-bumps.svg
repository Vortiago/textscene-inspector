<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Grayscale HEIGHT map for a displacementMap demo: white = raised, black =
       low. A 4x4 grid of domes with dark gaps gives a bumpy, golf-ball-like
       relief when displaced onto a subdivided sphere. Radial + solid fills so
       it rasterizes reliably. -->
  <rect width="256" height="256" fill="#000000"/>
  <defs>
    <radialGradient id="dome" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <g fill="url(#dome)">
    <circle cx="32" cy="32" r="27"/>
    <circle cx="96" cy="32" r="27"/>
    <circle cx="160" cy="32" r="27"/>
    <circle cx="224" cy="32" r="27"/>
    <circle cx="32" cy="96" r="27"/>
    <circle cx="96" cy="96" r="27"/>
    <circle cx="160" cy="96" r="27"/>
    <circle cx="224" cy="96" r="27"/>
    <circle cx="32" cy="160" r="27"/>
    <circle cx="96" cy="160" r="27"/>
    <circle cx="160" cy="160" r="27"/>
    <circle cx="224" cy="160" r="27"/>
    <circle cx="32" cy="224" r="27"/>
    <circle cx="96" cy="224" r="27"/>
    <circle cx="160" cy="224" r="27"/>
    <circle cx="224" cy="224" r="27"/>
  </g>
</svg>
