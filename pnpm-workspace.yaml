# pnpm workspace configuration
# Defines the monorepo structure for the TSCN File Previewer project

packages:
  # Main library packages
  - 'packages/*'

  # Application projects
  - 'apps/*'

# Catalog: Central dependency version management
# Use "catalog:" in package.json to reference these versions
catalog:
  # Shared dev dependencies
  typescript: ^6.0.3
  vitest: ^4.1
  rimraf: ^6.1.3
  '@vscode/test-electron': ^3.1.0
  '@vitest/ui': ^4.1
  '@types/node': ^26.2.0
  vite: ^8.2.2
  esbuild: ^0.28.2
  happy-dom: ^20.11.6
  jsdom: ^30

  # CLI dependencies
  commander: ^15.0.0

  # R3F migration (Phase 14, WI-R3F-1) — spike-validated pins
  react: ^19.2
  react-dom: ^19.2
  '@types/react': ^19.2
  '@types/react-dom': ^19.2
  '@react-three/fiber': ^9.7
  '@react-three/drei': ^10.7
  '@react-three/postprocessing': ^3.1
  postprocessing: ^6.39
  '@react-three/test-renderer': ^9.1
  # NOTE: ^5 latest (5.2.0) declares peer vite ^4.2 || ^5 || ^6 || ^7 || ^8,
  # so it spans the vite 8 workspace pin. ^6.0 targets vite ^8 exclusively —
  # move there in its own bump if 5.x ever lags behind a vite major.
  '@vitejs/plugin-react': ^6.1
  three: ^0.185
  '@types/three': ^0.185

  # Procedural noise (NoiseTexture2D / FastNoiseLite). The official JS port of
  # the same upstream FastNoiseLite that Godot vendors in
  # `thirdparty/misc/FastNoiseLite.h`, so its enum values and generators are the
  # engine's own rather than a hand-port that would drift from them. MIT.
  fastnoise-lite: 1.1.1

  # Real CSG boolean evaluation (ADR-0026). three-bvh-csg is used DIRECTLY rather
  # than via @react-three/csg, whose latest release hard-pins three-bvh-csg ^0.0.16
  # and three-mesh-bvh ^0.6.8, both below what 0.0.18 requires against three 0.185.
  # three-mesh-bvh is a DIRECT dependency so pnpm satisfies the peer with this
  # version rather than resolving to drei's nested 0.8.3.
  three-bvh-csg: ^0.0.18
  three-mesh-bvh: ^0.9.14

  # React Testing Library (WI-R3F-4) — DOM-level UI tests under jsdom
  '@testing-library/react': ^16.3.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/user-event': ^14.6.6

  # ESLint plugins
  eslint-plugin-react-hooks: ^7.1
