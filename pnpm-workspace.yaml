# pnpm workspace configuration
# Defines the monorepo structure for the TSCN File Previewer project

packages:
  # Main library packages
  - 'packages/*'

  # Application projects
  - 'apps/*'

# Catalog: Central dependency version management
# Use "catalog:" in package.json to reference these versions
catalog:
  # Shared dev dependencies
  typescript: ^6.0.3
  vitest: ^4.1
  rimraf: ^6.1.3
  '@vitest/ui': ^4.1
  '@types/node': ^22.10.5
  vite: ^8.1.5
  esbuild: ^0.28.1
  happy-dom: ^20.10.6
  jsdom: ^29

  # CLI dependencies
  commander: ^12.1.0

  # R3F migration (Phase 14, WI-R3F-1) — spike-validated pins
  react: ^19.2
  react-dom: ^19.2
  '@types/react': ^19.2
  '@types/react-dom': ^19.2
  '@react-three/fiber': ^9.6
  '@react-three/drei': ^10.7
  '@react-three/test-renderer': ^9.1
  # NOTE: ^5 latest (5.2.0) declares peer vite ^4.2 || ^5 || ^6 || ^7 || ^8,
  # so it spans the vite 8 workspace pin. ^6.0 targets vite ^8 exclusively —
  # move there in its own bump if 5.x ever lags behind a vite major.
  '@vitejs/plugin-react': ^5.0
  three: ^0.185
  '@types/three': ^0.185

  # React Testing Library (WI-R3F-4) — DOM-level UI tests under jsdom
  '@testing-library/react': ^16.3.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/user-event': ^14.6.1

  # ESLint plugins
  eslint-plugin-react-hooks: ^7.1
