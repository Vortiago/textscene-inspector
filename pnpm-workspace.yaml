# pnpm workspace configuration
# Defines the monorepo structure for the TSCN File Previewer project

packages:
  # Main library packages
  - 'packages/*'

  # Application projects
  - 'apps/*'

# Catalog: Central dependency version management
# Use "catalog:" in package.json to reference these versions
catalog:
  # Shared dev dependencies
  # TypeScript 7 runs `tsc`. It ships no JavaScript compiler API, so `typescript` names the
  # TypeScript 6 API, which the ESLint parser, dts-bundle-generator and our syntax scripts import.
  '@typescript/native': npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.1.0
  rimraf: ^6.1.4
  '@vscode/test-electron': ^3.1.0
  '@vscode/test-web': ^0.0.81
  '@vitest/ui': ^5.1.0
  '@vitest/coverage-v8': ^5.1.0
  '@types/node': ^26.6.6
  vite: ^8.3.3
  esbuild: ^0.28.2
  happy-dom: ^21.0.3
  jsdom: ^30.1.3

  # Declaration bundling for @textscene/tscn: one .d.ts that imports nothing from the workspace.
  dts-bundle-generator: ^9.5.1

  # CLI dependencies
  commander: ^15.0.0

  # Language Server Protocol (tscn-lsp). The VS Code extension uses the editor's
  # own API, so only the standalone server depends on these.
  vscode-languageserver: ^11.0.0
  vscode-languageserver-textdocument: ^1.0.16

  # R3F migration (Phase 14, WI-R3F-1) — spike-validated pins
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3
  '@types/react-dom': ^19.3
  '@react-three/fiber': ^9.8.2
  '@react-three/drei': ^10.7.9
  postprocessing: ^6.39.6
  '@react-three/test-renderer': ^9.1.1
  # ^6 targets vite ^8 exclusively, the workspace's vite pin.
  '@vitejs/plugin-react': ^6.2.1
  three: ^0.187
  '@types/three': ^0.187

  # Procedural noise (NoiseTexture2D / FastNoiseLite). The official JS port of
  # the same upstream FastNoiseLite that Godot vendors in
  # `thirdparty/misc/FastNoiseLite.h`, so its enum values and generators are the
  # engine's own rather than a hand-port that would drift from them. MIT.
  fastnoise-lite: 1.1.1

  # Zstandard decoding for a compressed binary resource (RSCC), the mode Godot saves by default.
  # Pure JS, as the VS Code webview's policy allows no WebAssembly. MIT.
  fzstd: 0.1.1

  # Brotli decoding for the tables of a .woff2 scene font. Pure JS, as the VS Code webview's
  # policy allows no WebAssembly, and `DecompressionStream` has no brotli format. MIT.
  brotli: 2.1.0

  # PNG decoding: the visual and Godot-reference scripts, and the capture checks in the
  # VS Code integration suite.
  pngjs: ^7.0.0
  '@types/pngjs': ^6.0.5

  # The PR labeler test reads .github/labeler.yml and matches its globs as actions/labeler does.
  minimatch: ^11.0.4
  yaml: ^2.9.1

  # Real CSG boolean evaluation (ADR-0026). three-bvh-csg is used DIRECTLY rather
  # than via @react-three/csg, whose latest release hard-pins three-bvh-csg ^0.0.16
  # and three-mesh-bvh ^0.6.8, both below what three-bvh-csg requires of the pinned three.
  # three-mesh-bvh is a DIRECT dependency so pnpm satisfies the peer with this
  # version rather than resolving to drei's nested 0.8.3.
  three-bvh-csg: ^0.0.18
  three-mesh-bvh: ^0.9.18

  # React Testing Library (WI-R3F-4) — DOM-level UI tests under jsdom
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/user-event': ^14.6.8

  # ESLint plugins
  eslint-plugin-react-hooks: ^7.1

  # Formatting (prettier.config.mjs). Exact: a patch release can change the output, and
  # `pnpm format:check` fails on every file it reflows.
  prettier: 3.9.10

  # Font baking (scripts/fonts/bake-metrics.mjs) — devDependencies
  # of the repo root only, never shipped: fontkit reads hhea/OS-2/hmtx from
  # the vendored TTF/OTF (it does not decompress woff2 itself), wawoff2
  # decompresses the vendored woff2 to the TTF fontkit and msdf-bmfont-xml
  # both need, and msdf-bmfont-xml bakes the MSDF glyph atlas.
  fontkit: ^2.0.4
  wawoff2: ^2.0.1
  msdf-bmfont-xml: ^2.8.0
